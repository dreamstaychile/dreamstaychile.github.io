<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Pago seguro | Dream Stay Chile</title>
  <meta name="description" content="Realiza el pago de tu reserva Dream Stay de forma rápida y segura mediante Mercado Pago." />
  <link rel="canonical" href="https://www.dreamstaychile.com/pagar/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Dream Stay Chile" />
  <meta property="og:url" content="https://www.dreamstaychile.com/pagar/" />
  <meta property="og:title" content="Pago seguro | Dream Stay Chile" />
  <meta property="og:description" content="Realiza el pago de tu reserva de forma rápida y segura mediante Mercado Pago." />
  <meta property="og:image" content="https://www.dreamstaychile.com/assets/dreamstay-mercadopago.png?v=20260906-3" />
  <meta property="og:image:secure_url" content="https://www.dreamstaychile.com/assets/logo.png?v=20260906-3" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="988" />
  <meta property="og:image:alt" content="Dream Stay Chile - Pago seguro" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pago seguro | Dream Stay Chile" />
  <meta name="twitter:description" content="Realiza el pago de tu reserva de forma rápida y segura mediante Mercado Pago." />
  <meta name="twitter:image" content="https://www.dreamstaychile.com/assets/logo.png?v=20260906-3" />

  <style>
    :root{--coral:#FF5E62;--text:#202124;--muted:#6F7277;--border:#E7E7E7;--bg:#F5F5F3;--mp-blue:#009EE3;--white:#FFFFFF}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
    .card{width:100%;max-width:460px;background:var(--white);border:1px solid var(--border);border-radius:24px;padding:34px 34px 28px;box-shadow:0 8px 30px rgba(0,0,0,.035)}
    .brands{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:30px}
    .dreamstay-brand{display:flex;align-items:center;gap:11px;min-width:0}
    .dreamstay-icon{width:58px;height:58px;object-fit:contain;flex:0 0 auto}
    .dreamstay-copy{line-height:1.02;white-space:nowrap}
    .dreamstay-name{color:var(--coral);font-size:22px;font-weight:800;letter-spacing:-.4px}
    .dreamstay-tagline{margin-top:5px;color:#8A8A8A;font-size:8px;font-weight:700;letter-spacing:1.15px}
    .separator{width:1px;height:52px;background:var(--border);flex:0 0 1px}
    .mp-mark-wrap{width:82px;height:72px;overflow:hidden;position:relative;flex:0 0 82px}
    .mp-mark{position:absolute;height:96px;width:auto;max-width:none;left:-24px;top:-10px;display:block}
    h1{margin:0;text-align:center;font-size:26px;letter-spacing:-.45px}
    .intro{margin:9px 0 28px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
    label{display:block;margin-bottom:9px;font-size:13px;font-weight:700}
    .amount{display:flex;align-items:center;min-height:66px;border:1.5px solid #DCDCDC;border-radius:16px;padding:0 16px;background:#fff;transition:.2s ease}
    .amount:focus-within{border-color:var(--mp-blue);box-shadow:0 0 0 4px rgba(0,158,227,.09)}
    .amount.fixed{background:#FAFAFA}
    .symbol{margin-right:10px;font-size:24px;font-weight:800}
    input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:26px;font-weight:750}
    input::placeholder{color:#A0A0A0}
    input[readonly]{cursor:default}
    .currency{margin-left:10px;color:var(--muted);font-size:12px;font-weight:700}
    .error{display:none;margin:8px 2px 0;color:#B42318;font-size:12px;font-weight:600}
    button{width:100%;min-height:58px;margin-top:20px;border:0;border-radius:14px;background:var(--mp-blue);color:#fff;font-size:16px;font-weight:800;cursor:pointer;transition:.15s ease}
    button:hover{filter:brightness(.96)}
    button:active{transform:translateY(1px)}
    .secure{margin-top:15px;text-align:center;color:var(--muted);font-size:12px}.secure strong{color:var(--text)}
    .footer{margin-top:24px;padding-top:18px;border-top:1px solid var(--border);text-align:center;color:#888;font-size:11px}
    @media(max-width:520px){body{padding:14px}.card{padding:28px 20px 24px;border-radius:20px}.brands{gap:14px;margin-bottom:26px}.dreamstay-icon{width:48px;height:48px}.dreamstay-name{font-size:18px}.dreamstay-tagline{font-size:7px;letter-spacing:.9px}.separator{height:46px}.mp-mark-wrap{width:70px;height:62px;flex-basis:70px}.mp-mark{height:84px;left:-21px;top:-9px}h1{font-size:23px}}
    @media(max-width:380px){.brands{gap:10px}.dreamstay-icon{width:42px;height:42px}.dreamstay-name{font-size:16px}.dreamstay-tagline{display:none}.mp-mark-wrap{width:64px;height:58px;flex-basis:64px}.mp-mark{height:78px;left:-19px;top:-8px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brands" aria-label="Dream Stay y Mercado Pago">
      <div class="dreamstay-brand">
        <img class="dreamstay-icon" src="../assets/logo-coral.png" alt="Dream Stay" />
        <div class="dreamstay-copy">
          <div class="dreamstay-name">Dream Stay</div>
          <div class="dreamstay-tagline">BIENVENIDO, SIEMPRE</div>
        </div>
      </div>
      <div class="separator" aria-hidden="true"></div>
      <div class="mp-mark-wrap" aria-label="Mercado Pago">
        <img class="mp-mark" src="../assets/mercadopago-logo.png" alt="Mercado Pago" />
      </div>
    </div>

    <h1>Realiza tu pago</h1>
    <p class="intro">Ingresa el monto informado para tu reserva.</p>

    <form id="paymentForm" novalidate>
      <label for="amount">Monto a pagar</label>
      <div class="amount" id="amountBox">
        <span class="symbol">$</span>
        <input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="90.000" />
        <span class="currency">CLP</span>
      </div>
      <div id="error" class="error">Ingresa un monto válido.</div>
      <button type="submit">Pagar con Mercado Pago</button>
      <div class="secure">🔒 Pago seguro procesado por <strong>Mercado Pago</strong></div>
    </form>

    <div class="footer">Cobro realizado por Dream Stay Chile</div>
  </main>

  <script>
    const MERCADO_PAGO_URL="https://link.mercadopago.cl/dreamstay";
    const form=document.getElementById("paymentForm");
    const input=document.getElementById("amount");
    const amountBox=document.getElementById("amountBox");
    const error=document.getElementById("error");
    const formatter=new Intl.NumberFormat("es-CL");

    const params=new URLSearchParams(window.location.search);
    const preset=(params.get("monto")||"").replace(/\D/g,"").slice(0,9);
    const fixed=params.get("fijo")==="1";

    if(preset){
      input.value=formatter.format(Number(preset));
      if(fixed){
        input.readOnly=true;
        input.setAttribute("aria-readonly","true");
        amountBox.classList.add("fixed");
      }
    }

    input.addEventListener("input",()=>{
      const digits=input.value.replace(/\D/g,"").slice(0,9);
      input.value=digits?formatter.format(Number(digits)):"";
      error.style.display="none";
    });

    form.addEventListener("submit",event=>{
      event.preventDefault();
      const amount=Number(input.value.replace(/\D/g,""));
      if(!Number.isFinite(amount)||amount<=0){
        error.style.display="block";
        input.focus();
        return;
      }
      window.location.href=MERCADO_PAGO_URL;
    });
  </script>
</body>
</html>
