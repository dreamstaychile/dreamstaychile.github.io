<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Pago | Dream Stay Chile</title>
  <style>
    :root{
      --coral:#FF5E62;
      --text:#202124;
      --muted:#6F7277;
      --border:#E7E7E7;
      --bg:#F5F5F3;
      --mp-blue:#009EE3;
      --white:#FFFFFF;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
    }
    .card{
      width:100%;
      max-width:460px;
      background:var(--white);
      border:1px solid var(--border);
      border-radius:24px;
      padding:34px 34px 28px;
      box-shadow:0 8px 30px rgba(0,0,0,.035);
    }
    .brands{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:24px;
      margin-bottom:30px;
    }
    .dreamstay-brand{
      display:flex;
      align-items:center;
      gap:11px;
      min-width:0;
    }
    .dreamstay-icon{
      width:58px;
      height:58px;
      object-fit:contain;
      flex:0 0 auto;
    }
    .dreamstay-copy{line-height:1.02;white-space:nowrap}
    .dreamstay-name{
      color:var(--coral);
      font-size:22px;
      font-weight:800;
      letter-spacing:-.4px;
    }
    .dreamstay-tagline{
      margin-top:5px;
      color:#8A8A8A;
      font-size:8px;
      font-weight:700;
      letter-spacing:1.15px;
    }
    .separator{
      width:1px;
      height:48px;
      background:var(--border);
      flex:0 0 1px;
    }
    .mp-logo{
      width:190px;
      max-width:45%;
      height:auto;
      display:block;
    }
    h1{
      margin:0;
      text-align:center;
      font-size:26px;
      letter-spacing:-.45px;
    }
    .intro{
      margin:9px 0 28px;
      text-align:center;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }
    label{
      display:block;
      margin-bottom:9px;
      font-size:13px;
      font-weight:700;
    }
    .amount{
      display:flex;
      align-items:center;
      min-height:66px;
      border:1.5px solid #DCDCDC;
      border-radius:16px;
      padding:0 16px;
      background:#fff;
      transition:.2s ease;
    }
    .amount:focus-within{
      border-color:var(--mp-blue);
      box-shadow:0 0 0 4px rgba(0,158,227,.09);
    }
    .symbol{
      margin-right:10px;
      font-size:24px;
      font-weight:800;
    }
    input{
      min-width:0;
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:26px;
      font-weight:750;
    }
    input::placeholder{color:#A0A0A0}
    .currency{
      margin-left:10px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    .error{
      display:none;
      margin:8px 2px 0;
      color:#B42318;
      font-size:12px;
      font-weight:600;
    }
    button{
      width:100%;
      min-height:58px;
      margin-top:20px;
      border:0;
      border-radius:14px;
      background:var(--mp-blue);
      color:#fff;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      transition:.15s ease;
    }
    button:hover{filter:brightness(.96)}
    button:active{transform:translateY(1px)}
    .secure{
      margin-top:15px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }
    .secure strong{color:var(--text)}
    .footer{
      margin-top:24px;
      padding-top:18px;
      border-top:1px solid var(--border);
      text-align:center;
      color:#888;
      font-size:11px;
    }
    @media(max-width:520px){
      body{padding:14px}
      .card{padding:28px 20px 24px;border-radius:20px}
      .brands{gap:14px;margin-bottom:26px}
      .dreamstay-icon{width:48px;height:48px}
      .dreamstay-name{font-size:18px}
      .dreamstay-tagline{font-size:7px;letter-spacing:.9px}
      .separator{height:42px}
      .mp-logo{width:160px;max-width:43%}
      h1{font-size:23px}
    }
    @media(max-width:380px){
      .brands{gap:10px}
      .dreamstay-icon{width:42px;height:42px}
      .dreamstay-name{font-size:16px}
      .dreamstay-tagline{display:none}
      .mp-logo{width:140px}
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brands" aria-label="Dream Stay y Mercado Pago">
      <div class="dreamstay-brand">
        <img class="dreamstay-icon" src="../assets/logo-coral.png" alt="Dream Stay" />
        <div class="dreamstay-copy">
          <div class="dreamstay-name">Dream Stay</div>
          <div class="dreamstay-tagline">BIENVENIDO, SIEMPRE</div>
        </div>
      </div>
      <div class="separator" aria-hidden="true"></div>
      <img class="mp-logo" src="../assets/mercadopago-logo.svg" alt="Mercado Pago" />
    </div>

    <h1>Realiza tu pago</h1>
    <p class="intro">Ingresa el monto informado para tu reserva.</p>

    <form id="paymentForm" novalidate>
      <label for="amount">Monto a pagar</label>
      <div class="amount">
        <span class="symbol">$</span>
        <input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="90.000" />
        <span class="currency">CLP</span>
      </div>
      <div id="error" class="error">Ingresa un monto válido.</div>
      <button type="submit">Pagar con Mercado Pago</button>
      <div class="secure">🔒 Pago seguro procesado por <strong>Mercado Pago</strong></div>
    </form>

    <div class="footer">Cobro realizado por Dream Stay Chile</div>
  </main>

  <script>
    const MERCADO_PAGO_URL="https://link.mercadopago.cl/dreamstay";
    const form=document.getElementById("paymentForm"),input=document.getElementById("amount"),error=document.getElementById("error");
    input.addEventListener("input",()=>{
      const digits=input.value.replace(/\D/g,"").slice(0,9);
      input.value=digits?new Intl.NumberFormat("es-CL").format(Number(digits)):"";
      error.style.display="none";
    });
    form.addEventListener("submit",event=>{
      event.preventDefault();
      const amount=Number(input.value.replace(/\D/g,""));
      if(!Number.isFinite(amount)||amount<=0){
        error.style.display="block";
        input.focus();
        return;
      }
      window.location.href=MERCADO_PAGO_URL;
    });
  </script>
</body>
</html>
