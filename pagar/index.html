<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Pago | Dream Stay Chile</title>
  <style>
    :root{--coral:#FF385C;--text:#222;--muted:#737373;--border:#E8E8E8;--bg:#F7F7F5;--mp-blue:#009EE3;--white:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
    .card{width:100%;max-width:390px;background:var(--white);border:1px solid var(--border);border-radius:20px;padding:28px 24px 24px}
    .logos{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:26px}
    .logo-wrap{display:flex;align-items:center;justify-content:center;min-width:0}
    .dreamstay-logo{width:125px;max-height:58px;object-fit:contain}
    .mp-brand{display:flex;align-items:center;gap:8px;color:#333;font-size:19px;font-weight:700;white-space:nowrap}
    .mp-mark{width:42px;height:28px;border-radius:50%;background:#00AEEF;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:900;letter-spacing:-2px}
    .separator{height:34px;width:1px;background:var(--border)}
    h1{margin:0;text-align:center;font-size:22px}
    .intro{margin:8px 0 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.45}
    label{display:block;margin-bottom:8px;font-size:13px;font-weight:700}
    .amount{display:flex;align-items:center;min-height:60px;border:1.5px solid var(--border);border-radius:14px;padding:0 14px;transition:.2s ease}
    .amount:focus-within{border-color:var(--mp-blue);box-shadow:0 0 0 3px rgba(0,158,227,.10)}
    .symbol{margin-right:8px;font-size:22px;font-weight:700}
    input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:24px;font-weight:750}
    .currency{margin-left:8px;color:var(--muted);font-size:12px;font-weight:700}
    .error{display:none;margin:8px 2px 0;color:#B42318;font-size:12px;font-weight:600}
    button{width:100%;min-height:54px;margin-top:20px;border:0;border-radius:13px;background:var(--mp-blue);color:#fff;font-size:16px;font-weight:750;cursor:pointer}
    button:hover{filter:brightness(.96)}
    .secure{margin-top:13px;text-align:center;color:var(--muted);font-size:12px}.secure strong{color:var(--text)}
    .footer{margin-top:22px;padding-top:17px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:11px}
    @media(max-width:420px){.card{padding:24px 18px 20px}.logos{gap:12px}.dreamstay-logo{width:105px}.mp-brand{font-size:17px}.mp-mark{width:38px;height:26px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logos">
      <div class="logo-wrap"><img class="dreamstay-logo" src="../assets/logo-coral.png" alt="Dream Stay Chile" /></div>
      <div class="separator" aria-hidden="true"></div>
      <div class="logo-wrap"><div class="mp-brand" aria-label="Mercado Pago"><span class="mp-mark" aria-hidden="true">MP</span><span>Mercado Pago</span></div></div>
    </div>
    <h1>Realiza tu pago</h1>
    <p class="intro">Ingresa el monto informado para tu reserva.</p>
    <form id="paymentForm" novalidate>
      <label for="amount">Monto a pagar</label>
      <div class="amount"><span class="symbol">$</span><input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="90.000" /><span class="currency">CLP</span></div>
      <div id="error" class="error">Ingresa un monto válido.</div>
      <button type="submit">Pagar con Mercado Pago</button>
      <div class="secure">🔒 Pago seguro procesado por <strong>Mercado Pago</strong></div>
    </form>
    <div class="footer">Cobro realizado por Dream Stay Chile</div>
  </main>
  <script>
    const MERCADO_PAGO_URL="https://link.mercadopago.cl/dreamstay";
    const form=document.getElementById("paymentForm"),input=document.getElementById("amount"),error=document.getElementById("error");
    input.addEventListener("input",()=>{const digits=input.value.replace(/\D/g,"").slice(0,9);input.value=digits?new Intl.NumberFormat("es-CL").format(Number(digits)):"";error.style.display="none"});
    form.addEventListener("submit",event=>{event.preventDefault();const amount=Number(input.value.replace(/\D/g,""));if(!Number.isFinite(amount)||amount<=0){error.style.display="block";input.focus();return}window.location.href=MERCADO_PAGO_URL});
  </script>
</body>
</html>
