<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Prueba conexión Airbnb · Dream Stay</title>
  <style>
    :root{--coral:#ef7778;--teal:#59b7aa;--ink:#183331;--muted:#6d7d7a;--line:#e4ecea;--bg:#f7faf9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    main{width:min(100%,620px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px;text-align:center;box-shadow:0 20px 60px rgba(24,51,49,.09)}
    img{width:min(220px,70%);height:auto;margin:0 auto 24px;display:block}
    h1{margin:0;font-size:30px;letter-spacing:-.03em}
    p{color:var(--muted);line-height:1.6}
    .test{margin:28px auto;padding:24px;border:1px dashed var(--teal);border-radius:16px;background:rgba(89,183,170,.06)}
    small{display:block;margin-top:22px;color:#8a9996}
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo-coral.png" alt="Dream Stay">
    <h1>Prueba de conexión con Airbnb</h1>
    <p>Esta página es temporal y se utiliza únicamente para validar la conexión Dream Stay · Beds24 · Airbnb.</p>

    <div class="test">
      <span class="airbnb-connect"
        data-state="s://www.dreamstaychile.com/conexion-exitosa/_ownerid=177751"
        data-client-id="6gsna623mfeic93fod1fcqlr"
        data-scope="property_management,reservations_web_hooks,messages_read,messages_write"
        data-redirect-uri="https://api.beds24.com/airbnb.com/push.php">
      </span>
      <script src="https://www.airbnb.com/platform_js" async defer></script>
    </div>

    <small>No indexada · Página temporal de prueba</small>
  </main>
</body>
</html>
